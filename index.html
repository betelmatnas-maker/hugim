  .hero-bar{ background:var(--sky); }
  .hero-bar-inner{ max-width:1100px; margin:0 auto; padding:20px 24px; color:#fff; }
  .hero-bar-inner p.sub{
    font-size:clamp(14px,2vw,17px); margin:0 0 16px; max-width:640px; opacity:.92; font-weight:500;
  }

  .search-wrap{ display:flex; gap:10px; max-width:520px; }
  .search-wrap input{
    flex:1; border:none; padding:14px 16px;
    font-size:16px; font-family:inherit; box-shadow:var(--shadow);
    min-width:0;
  }
  .search-wrap input:focus{outline:3px solid rgba(255,255,255,.6);}

  /* ---------- Utility bar (cancellation form / vacation schedule) ---------- */
  .utility-bar{
    max-width:1100px; margin:10px auto 0; padding:0 24px;
    display:flex; gap:8px; flex-wrap:wrap;
  }
  .utility-btn{
    flex:0 1 auto; border:none; background:var(--gold);
    color:var(--ink); font-family:'Rubik',sans-serif; font-weight:700; font-size:12.5px;
    padding:6px 12px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:5px;
    transition:.15s; border-radius:0; box-shadow:0 2px 5px rgba(43,33,24,0.15);
  }
  .utility-btn:hover{ opacity:.85; }
  .utility-btn.utility-btn-swim{ background:var(--sky); color:#fff; }

  /* ---------- Section tabs (חוגים / חוגי שחיה) ---------- */
  .section-tabs-wrap{ max-width:1100px; margin:14px auto 0; padding:0 24px; }
  .section-tabs-caption{
    font-family:'Rubik',sans-serif; font-weight:700; font-size:12px; color:var(--ink-soft);
    text-align:center; margin-bottom:6px;
  }
  .section-tabs{
    display:flex; gap:8px; flex-wrap:wrap;
  }
  .section-tab{
    flex:1 1 220px; border:none; background:var(--bg-card);
    box-shadow:0 2px 8px rgba(43,33,24,0.08);
    padding:10px 14px; cursor:pointer; position:relative; overflow:hidden;
    display:flex; flex-direction:row; align-items:center; text-align:right; gap:10px;
    min-height:auto; justify-content:flex-start;
    transition:transform .15s, box-shadow .15s, background-color .15s;
    color:var(--ink); border-radius:0;
  }
  .section-tab:hover{ transform:translateY(-2px); box-shadow:0 6px 14px rgba(43,33,24,0.14); }
  .section-tab .tab-icon{ font-size:20px; line-height:1; }
  .section-tab .tab-title{ font-family:'Rubik',sans-serif; font-weight:800; font-size:14.5px; }
  .section-tab .tab-desc{ font-size:11px; color:var(--ink-soft); font-weight:600; }
  .section-tab .tab-check{

  /* ---------- Start gate (help me choose) ---------- */
  .start-gate{ max-width:1100px; margin:8px auto 0; padding:0 24px; }
  .utility-btn-help{ background:var(--coral); color:#fff; }
  .utility-btn-help:hover{ opacity:.85; }

  .interest-badge{
    border:none; background:var(--plum-soft); color:var(--plum); font-weight:700; font-size:13px;
    padding:7px 14px; cursor:pointer; display:none; align-items:center; gap:6px;
  }
  .wizard-options{ display:flex; flex-direction:column; gap:8px; margin:10px 0 4px; }
  .wizard-opt{
    text-align:right; border:none; background:var(--bg);
    padding:13px 16px; font-size:14.5px; font-weight:600; cursor:pointer; transition:.15s; border-radius:0;
    box-shadow:0 1px 4px rgba(43,33,24,0.10);
  }
  .wizard-opt:hover{ background:var(--sky-soft); }
  .wizard-opt.selected{ background:var(--sky); color:#fff; font-weight:800; }

  .wizard-hint{
    background:var(--gold-soft); border-right:4px solid var(--gold); padding:11px 14px;
    font-size:12.5px; color:#7a5a12; margin:4px 0 16px; line-height:1.6;
  }
  .age-stepper-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
  .age-stepper-row .age-label{ font-weight:700; font-size:14px; }
  .stepper{ display:flex; align-items:center; border:1.5px solid var(--line); }
  .stepper button{ width:40px; height:40px; border:none; background:var(--bg); font-size:20px; font-weight:800; cursor:pointer; color:var(--sky); }
  .stepper button:hover{ background:var(--sky-soft); }
  .stepper input{
    width:56px; text-align:center; border:none; border-right:1.5px solid var(--line); border-left:1.5px solid var(--line);
    font-size:16px; font-weight:700; padding:9px 0; background:#fff;
  }
  .remove-age-btn{ background:none; border:none; color:var(--coral); font-size:18px; font-weight:700; cursor:pointer; padding:0 4px; }

  /* ---------- Filters ---------- */
  .filters{max-width:1100px; margin:12px auto 0; padding:0 24px;}
  .filters-toggle{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    border:none; background:var(--bg-card); padding:9px 14px; box-shadow:0 1px 4px rgba(43,33,24,0.08);
    font-family:'Rubik',sans-serif; font-weight:700; font-size:13.5px; color:var(--ink);
    cursor:pointer; margin-bottom:0; border-radius:0;
  }
  .filters-toggle-icon{ font-weight:800; transition:transform .15s; }
  .filters-toggle.open .filters-toggle-icon{ transform:rotate(180deg); }
  .filters-body{ display:none; padding-top:14px; }
  .filters-body.open{ display:block; }
  .filter-label{font-weight:700; font-size:13px; color:var(--ink-soft); margin:0 0 8px 2px;}
  .chip-row{display:flex; flex-wrap:wrap; gap:8px; padding-bottom:2px; margin-bottom:16px;}
  .chip{
    flex:0 0 auto; border:none; background:#fff; color:var(--ink);
    box-shadow:0 1px 4px rgba(43,33,24,0.10);
    padding:9px 16px; border-radius:0; font-size:14px; font-weight:600; cursor:pointer;
    white-space:nowrap; transition:.15s;
  }
  .chip.active{background:var(--coral); color:#fff;}
  .chip:hover:not(.active){background:var(--coral-soft);}

  .active-bar{
    max-width:1100px; margin:0 auto 18px; padding:0 24px;
  }
  .active-bar-row{

<script>
let COURSES = [];

const CATEGORY_COLORS = [
  {keys:['כדורגל','כדורסל','טאווקנדו'], bg:'var(--coral-soft)', fg:'var(--coral)'},
  {keys:['ריקוד','מחול','תיאטרון','ריקודי עם'], bg:'var(--plum-soft)', fg:'var(--plum)'},
  {keys:['כושר','יוגה','פלדנקרייז'], bg:'var(--teal-soft)', fg:'var(--teal)'},
  {keys:['אלקטרוניקה','טבע'], bg:'var(--sky-soft)', fg:'var(--sky)'},
  {keys:['ערבית'], bg:'var(--gold-soft)', fg:'#8a6a12'},
];
function colorFor(category){
  for(const g of CATEGORY_COLORS){ if(g.keys.some(k=>category.includes(k))) return g; }
  return {bg:'var(--gold-soft)', fg:'#8a6a12'};
}

const DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי'];

// Each "section" is a fully separate data source (its own Google Sheet + Apps Script deployment)
// but shares the exact same site design, filters, wizard, and registration flow.
const SECTIONS = {
  regular: {
    label: 'חוגים',
    desc: 'ספורט, מחול, אמנות ועוד',
    icon: '🏃',
    sheetUrl: "https://script.google.com/macros/s/AKfycbw_eOpPDf7N3dSteWgwGLNySobeFBewrWmteAFGDjGYa31_UilCbsMDxnLGO3v4vHI/exec"
  },
  swim: {
    label: 'חוגי שחיה',
    desc: 'כל חוגי השחייה בבריכה',
    icon: '🏊',
    sheetUrl: "https://script.google.com/macros/s/AKfycbx4q6imlVE5V7XzlX8fieRWietxqSFGWPr-z3lu2Z83lEWPLjIPKte9c4kxKQyCpjdv/exec"
  }
};
let currentSection = 'regular';

// ---- derive an age-group label from the course name/category (mirrors the original data prep) ----
// ---- shared grade-range parsing (used by both the automatic guess and the "קהל יעד" column) ----
// supports every grade from א' (1st) through יב' (12th)
const GRADE_VALUE = {'א':1,'ב':2,'ג':3,'ד':4,'ה':5,'ו':6,'ז':7,'ח':8,'ט':9,'י':10,'יא':11,'יב':12};

function matchGradeRange(text){
  // try two-letter grades (יא, יב) before single letters so they aren't cut short
  const re = /(?<![א-ת])(יא|יב|[א-י])['׳`]?\s*-\s*(יא|יב|[א-י])['׳`]?(?![א-ת])/;
  const m = text.match(re);
  if(!m) return null;
  const g1 = GRADE_VALUE[m[1]], g2 = GRADE_VALUE[m[2]];
  if(!g1 || !g2) return null;
  return { lo: Math.min(g1,g2), hi: Math.max(g1,g2) };
}

function gradeRangeToLabel(lo, hi){
  // starts young (גן/א') and spans most of childhood -> treat as "any child age", not a narrow bucket
  if(lo <= 2 && hi - lo >= 4) return 'ילדים (כל הגילאים)';
  if(hi <= 2) return 'גיל הרך (גן-ב׳)';
  if(hi <= 4) return 'כיתות א׳-ד׳';
  if(hi <= 8) return 'כיתות ה׳-ח׳';
  return 'נוער'; // grades 9-12
}

function deriveAgeGroup(name, category){
  name = name || ''; category = category || '';
  const text = name + ' ' + category;

  // maps a specific age (in years) to its bucket label - same thresholds used by the wizard's age question
  function ageToLabel(age){
    if(age < 6) return 'גיל הרך (גן-ב׳)';
    if(age < 10) return 'כיתות א׳-ד׳';
    if(age < 14) return 'כיתות ה׳-ח׳';
    if(age < 18) return 'נוער';
    return 'מבוגרים / כולם';
  }

  // 1) explicit numeric age range in the text, e.g. "גילאי 5-8", "בני 3-5", "גיל 4-6"
  const numRangeMatch = text.match(/(\d{1,2})\s*[-–]\s*(\d{1,2})/);
  if(numRangeMatch){
    const a = parseInt(numRangeMatch[1],10), b = parseInt(numRangeMatch[2],10);
    if(!isNaN(a) && !isNaN(b) && a>0 && a<99 && b>0 && b<99){
      return ageToLabel(Math.round((a+b)/2));
    }
  }
  // single explicit age mention, e.g. "גיל 6 ומעלה", "בני 4"
  const singleAgeMatch = text.match(/(?:גיל|גילאי|בני|בנות|בן|בת)\s*(\d{1,2})(?!\s*[-–])/);
  if(singleAgeMatch){
    const a = parseInt(singleAgeMatch[1],10);
    if(!isNaN(a) && a>0 && a<99) return ageToLabel(a);
  }

  // 2) school-grade hyphen-range patterns - covers ANY grade combination from א' to יב'
  //    (not just narrow pairs - e.g. "ה-ח", "ב-ה", or "ז-יב" for subjects like גמרא/משנה
  //    or competitive teams that span a wider range)
  if(/גן\s*חובה/.test(text)) return 'גיל הרך (גן-ב׳)';
  const gradeRange = matchGradeRange(text);
  if(gradeRange) return gradeRangeToLabel(gradeRange.lo, gradeRange.hi);

  // 3) a single grade mentioned alone (no range), e.g. "כיתה ג", "כיתות ה'"
  const singleGradeMatch = text.match(/כית[הות]+\s*['׳`]?\s*([אבגדהוזח])(?![א-ת])/);
  if(singleGradeMatch){
    const g = singleGradeMatch[1];
    if(g==='א' || g==='ב') return 'גיל הרך (גן-ב׳)';
    if(g==='ג' || g==='ד') return 'כיתות א׳-ד׳';
    return 'כיתות ה׳-ח׳'; // ה,ו,ז,ח
  }

  // 4) age-descriptive keywords that aren't grade-based
  if(/תינוקות|פעוטות|טרום\s*חובה|גן\s*טרום/.test(text)) return 'גיל הרך (גן-ב׳)';

  // check the course NAME first for "נוער" (youth) - a genuine age signal, not gender
  if(/נוער|נער/.test(name)) return 'נוער';
  if(/נוער|נער/.test(category)) return 'נוער';
  if(name.includes('בנות') || name.includes('בנים')) return 'ילדים (כל הגילאים)';
  return 'מבוגרים / כולם';
}

// ---- derive a display icon from the category ----
function deriveIcon(category){
  category = category || '';
  const map = [
    ['פלדנקרייז','🧘'],['כושר','💪'],['ריקוד לטיני','💃'],['טאווקנדו','🥋'],
    ['ריקודי עם','🕺'],['כדורגל','⚽'],['כדורסל','🏀'],['אלקטרוניקה','🔌'],
    ['יוגה','🧘'],['תיאטרון','🎭'],['מחול','🩰'],['טבע','🌿'],['ערבית','🗣️'],
  ];
  for(const [key,icon] of map){ if(category.includes(key)) return icon; }
  return '⭐';
}

// ---- derive which gender(s) a course is aimed at - checks name, then category, then description ----
// (priority order matters: a mixed category label like "יוגה גברים/נשים" must not override
// a course name that already says which one it is)
// Gender is intentionally NOT auto-guessed from the name/category (Hebrew grammatical gender in
// words like "מתחילות" vs "מתחילים" is too easy to get wrong). It comes only from the explicit
// "קהל יעד" column; if that's not filled in, the course is treated as open to everyone.

// ---- parse the explicit "קהל יעד" column (e.g. "ה'-ח' בנים", "הכל מעורב") when the office fills it in.
//      Returns {ageGroup, gender} or null if the cell is empty/unrecognized, so the caller can fall
//      back to the automatic name-based guessing. ageGroup === null means "no age restriction" (wildcard).
function parseTargetAudience(raw){
  if(!raw) return null;
  let text = raw.toString().trim();
  if(!text) return null;

  // normalize all apostrophe/geresh variants (' ’ ` ׳) to nothing, so it doesn't matter which
  // character was typed/auto-corrected in the sheet - "א'-ד'" and "א׳-ד׳" both match reliably
  text = text.replace(/['’`׳]/g, '');

  const GENDER_TOKENS = {
    "בנים": 'בנים/גברים',
    "בנות": 'בנות/נשים',
    "מעורב": 'משותף לכולם',
  };
  let genderToken = null;
  for(const key of Object.keys(GENDER_TOKENS)){ if(text.includes(key)){ genderToken = key; break; } }
  const gender = genderToken ? GENDER_TOKENS[genderToken] : 'משותף לכולם';

  // age part: a few fixed keywords that aren't expressible as a grade range, then fall back to
  // the general grade-range parser so ANY combination (א-ד, ה-ח, א-ח, ז-יב, ב-ה...) is understood
  let ageGroup;
  if(text.includes('הכל')){
    ageGroup = null; // wildcard - matches any age
  }else if(text.includes('מבוגרים')){
    ageGroup = 'מבוגרים / כולם';
  }else if(text.includes('נוער')){
    ageGroup = 'נוער';
  }else if(/גן\s*-?\s*ב|גן\s*חובה/.test(text)){
    ageGroup = 'גיל הרך (גן-ב׳)';
  }else{
    const gradeRange = matchGradeRange(text);
    if(gradeRange){
      ageGroup = gradeRangeToLabel(gradeRange.lo, gradeRange.hi);
    }else{
      // age part not recognized at all - don't guess, fall back entirely to the automatic heuristics
      return null;
    }
  }

  return { ageGroup, gender };
}

// ---- load data via JSONP (a <script> tag load, not fetch) - this avoids CORS blocks entirely ----
function jsonpRequest(url){
  return new Promise((resolve, reject)=>{
    const cbName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random()*10000);
    const script = document.createElement('script');

    const cleanup = () => { delete window[cbName]; script.remove(); };

    window[cbName] = (data) => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error('JSONP request failed')); };

    const sep = url.includes('?') ? '&' : '?';
    script.src = url + sep + 'callback=' + cbName;
    document.body.appendChild(script);
  });
}

// ---- fetch the live course list from the currently selected section's Google Sheet ----
async function loadCourses(){
  const grid = document.getElementById('grid');
  grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="big">⏳</div>טוען את רשימת החוגים...</div>`;

  const url = SECTIONS[currentSection].sheetUrl;
  if(!url){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="big">🚧</div>הקטע הזה עוד לא מחובר לנתונים. בקרוב!</div>`;
    COURSES = [];
    return true;
  }

  try{
    const data = await jsonpRequest(url + '?action=courses');
    const rows = data.courses || [];

    COURSES = rows.map((r, i) => {
      const category = (r['תחום']||'').toString().trim();
      const name = (r['שם החוג']||'').toString().trim();
      const description = (r['מלל']||'').toString().trim() || 'פרטים נוספים יתעדכנו בקרוב.';

      const explicit = parseTargetAudience(r['קהל יעד']);
      const targetAudienceRaw = (r['קהל יעד']||'').toString().trim();

      return {
        id: 'c'+i,
        category,
        name,
        instructor: (r['מדריך/מדריכה']||'').toString().trim(),
        time: (r['שעת החוג']||'').toString().trim(),
        day: (r['יום']||'').toString().trim(),
        location: (r['מיקום']||'').toString().trim() || 'יתעדכן בהמשך',
        description,
        price: (r['מחיר של החוג']||'').toString().trim() || 'המחיר יתעדכן',

        targetAudience: targetAudienceRaw, // raw "קהל יעד" text, shown as-is in the detail view when filled in

      };
    }).filter(c => c.name);

const INTEREST_GROUPS = [

  {label:'מחול, ריקוד ותיאטרון', keys:['ריקוד','מחול','תיאטרון'], icon:'💃'},

function uniqueSorted(arr){ return [...new Set(arr)]; }

function buildFilters(){
  const cats = ['הכל', ...uniqueSorted(COURSES.map(c=>c.category))];
  const ages = ['הכל', ...uniqueSorted(COURSES.map(c=>c.ageGroup).filter(Boolean))];
  const genders = ['הכל', ...uniqueSorted(COURSES.map(c=>c.gender))];

  document.getElementById('categoryChips').innerHTML = cats.map(c=>
    `<button class="chip ${state.category===c?'active':''}" data-type="category" data-val="${c}">${c}</button>`
  ).join('');

  document.getElementById('ageChips').innerHTML = ages.map(a=>
    `<button class="chip ${state.age===a?'active':''}" data-type="age" data-val="${a}">${a}</button>`
  ).join('');

  document.getElementById('genderChips').innerHTML = genders.map(g=>
    `<button class="chip ${state.gender===g?'active':''}" data-type="gender" data-val="${g}">${g}</button>`
  ).join('');

  document.getElementById('dayChips').innerHTML = ['הכל', ...DAYS].map(d=>
    `<button class="chip ${d==='הכל' ? (state.days.length===0?'active':'') : (state.days.includes(d)?'active':'')}" data-day="${d}">${d}</button>`
  ).join('');

  document.querySelectorAll('[data-type]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state[btn.dataset.type] = btn.dataset.val;
      buildFilters();
      renderGrid();
    });
  });

  document.querySelectorAll('[data-day]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const d = btn.dataset.day;
      if(d==='הכל'){
        state.days = [];
      }else if(state.days.includes(d)){
        state.days = state.days.filter(x=>x!==d);
      }else{
        state.days = [...state.days, d];
      }
      buildFilters();
      renderGrid();
    });
  });

  const wizardActive = wizardFilters.ages.length>0 || wizardFilters.genders.length>0 || wizardFilters.interests.length>0 || wizardFilters.days.length>0;
  const anyActive = state.category!=='הכל' || state.age!=='הכל' || state.gender!=='הכל' || state.days.length>0 || state.search.trim()!=='' || wizardActive;
  document.getElementById('resetBtn').classList.toggle('show', anyActive);
  document.getElementById('activeBar').classList.toggle('filtered', anyActive);

  const chipsWrap = document.getElementById('activeChips');
  const chips = [];
  if(state.category!=='הכל') chips.push({label:'תחום: '+state.category, clear:"state.category='הכל'; buildFilters(); renderGrid();"});
  if(state.age!=='הכל') chips.push({label:'גיל: '+state.age, clear:"state.age='הכל'; buildFilters(); renderGrid();"});
  if(state.gender!=='הכל') chips.push({label:'מגדר: '+state.gender, clear:"state.gender='הכל'; buildFilters(); renderGrid();"});
  if(state.days.length>0) chips.push({label:'ימים: '+state.days.join(', '), clear:"state.days=[]; buildFilters(); renderGrid();"});
  if(state.search.trim()!=='') chips.push({label:'חיפוש: '+state.search, clear:"state.search=''; document.getElementById('searchInput').value=''; buildFilters(); renderGrid();"});
  if(wizardActive){
    const parts = [];
    if(wizardFilters.ages.length) parts.push(wizardFilters.ages.length+' קבוצות גיל');
    if(wizardFilters.genders.length) parts.push(wizardFilters.genders.length+' מגדר');
    if(wizardFilters.interests.length) parts.push(wizardFilters.interests.length+' תחומי עניין');
    if(wizardFilters.days.length) parts.push(wizardFilters.days.length+' ימים');
    chips.push({label:'מהשאלון: '+parts.join(' · '), clear:"clearInterest();"});
  }

  chipsWrap.classList.toggle('show', chips.length>0);
  chipsWrap.innerHTML = chips.map(c=>
    `<button class="active-chip" onclick="${c.clear}">${c.label} ✕</button>`
  ).join('');
}

function matches(course){
  const s = state.search.trim().toLowerCase();
  if(s){
    const hay = (course.name+' '+course.category+' '+course.instructor).toLowerCase();
    if(!hay.includes(s)) return false;
  }
  if(state.category!=='הכל' && course.category!==state.category) return false;
  if(state.age!=='הכל' && course.ageGroup!==null && course.ageGroup!==state.age) return false;
  if(state.gender!=='הכל' && course.gender!==state.gender) return false;
  if(state.days.length>0 && !state.days.some(d=>course.day.includes(d))) return false;

  if(wizardFilters.ages.length && course.ageGroup!==null && !wizardFilters.ages.includes(course.ageGroup)) return false;
  if(wizardFilters.genders.length && course.gender!=='משותף לכולם' && !wizardFilters.genders.includes(course.gender)) return false;
  if(wizardFilters.days.length && !wizardFilters.days.some(d=>course.day.includes(d))) return false;
  if(wizardFilters.interests.length){
    const ok = wizardFilters.interests.some(label=>{
      const group = INTEREST_GROUPS.find(g=>g.label===label);
      return group && group.keys.some(k=>course.category.includes(k));
    });
    if(!ok) return false;
  }
  return true;
}

    </div>
  `;

  const payload = { fname, lname, course:c.name, phone, entryDate };

  try{
    // no-cors + text/plain avoids a slow preflight request against Apps Script
    await fetch(SECTIONS[currentSection].sheetUrl, {
      method:'POST',

      headers:{ 'Content-Type':'text/plain' },
      body: JSON.stringify(payload)
    });
  }catch(err){

  }

  window.location.href = c.paymentLink;
  return false;
}

function wizardOptionsScreen(stepLabel, title, options, onContinue, onBack, preSelected){
  preSelected = preSelected || [];

      <div class="wizard-options">
        ${options.map(o=>`<button type="button" class="wizard-opt ${selected.has(o.val)?'selected':''}" data-val="${o.val}">${o.label}</button>`).join('')}
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-primary" id="wizardContinueBtn">המשך ←</button>
      ${onBack ? `<button type="button" class="btn btn-secondary" id="wizardBackBtn">→ חזרה לשאלה הקודמת</button>` : ''}
      <button type="button" class="btn btn-secondary" id="wizardSkipBtn">דלג על השאלה הזו ←</button>
    </div>
  `;
  document.getElementById('overlay').classList.add('open');

  modal.querySelectorAll('.wizard-opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const val = btn.dataset.val;
      if(selected.has(val)){ selected.delete(val); btn.classList.remove('selected'); }
      else{ selected.add(val); btn.classList.add('selected'); }
    });
  });

  document.getElementById('wizardContinueBtn').addEventListener('click', ()=> onContinue([...selected]));
  document.getElementById('wizardSkipBtn').addEventListener('click', ()=> onContinue([]));
  if(onBack){
    document.getElementById('wizardBackBtn').addEventListener('click', ()=> onBack([...selected]));
  }
}

// maps a single grade token (or "מבוגר") to the same age-group bucket used by "קהל יעד" - so the
// wizard and the office's own data speak exactly the same language
function gradeTokenToLabel(token){
  if(token === 'גן חובה') return 'גיל הרך (גן-ב׳)';
  if(token === 'מבוגר') return 'מבוגרים / כולם';
  const v = GRADE_VALUE[token];
  if(!v) return null;
  return gradeRangeToLabel(v, v);
}

      <span class="tab-icon">${s.icon}</span>
      <span class="tab-title">${s.label}</span>
      <span class="tab-desc">${s.desc}</span>
    </button>`;
  }).join('');

  updateCancelButton();

  wrap.querySelectorAll('.section-tab').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const key = btn.dataset.section;
      if(key===currentSection) return;
      currentSection = key;

      // starting fresh in the new section: clear all filters/wizard state and show the start-gate again
      state = { search:'', category:'הכל', age:'הכל', gender:'הכל', days:[] };
      wizardFilters = { ages:[], genders:[], interests:[], days:[] };
      document.getElementById('searchInput').value = '';
      document.getElementById('startGate').style.display = '';

      buildSectionTabs();
      const ok = await loadCourses();
      if(ok){ buildFilters(); renderGrid(); }
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

// ============ ביטול השתתפות בחוג ============

    <form id="cancelForm" onsubmit="return submitCancelForm(event)">
      <div class="form-step">
        <div class="field"><label for="cChildFirst">שם פרטי של הילד/ה</label><input type="text" id="cChildFirst" required></div>
        <div class="field"><label for="cChildLast">שם משפחה של הילד/ה</label><input type="text" id="cChildLast" required></div>
        <div class="field"><label for="cEmail">אימייל</label><input type="email" id="cEmail" required></div>
        <div class="field"><label for="cParent1">שם ההורה</label><input type="text" id="cParent1" required></div>
        <div class="field"><label for="cParent2">שם הורה נוסף (רשות)</label><input type="text" id="cParent2"></div>
        <div class="field"><label for="cPhone">טלפון</label><input type="tel" id="cPhone" required></div>
        <div class="field"><label for="cCourseName">שם החוג שרוצים לבטל</label><input type="text" id="cCourseName" required></div>
        <div class="field"><label for="cDate">תאריך</label><input type="date" id="cDate" value="${today}" required></div>
        <label class="checkbox-field">
          <input type="checkbox" required>
          <span>קראתי ואני מאשר/ת את <a href="https://www.matnas-betel.org.il/page.php?type=page&id=8044" target="_blank" rel="noopener">מדיניות הפרטיות</a></span>
        </label>
        <label class="checkbox-field">
          <input type="checkbox" required>
          <span>מאשר/ת בזאת את בקשת הביטול (מהווה חתימה דיגיטלית במקום חתימה בכתב יד)</span>
        </label>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-primary">שליחת בקשת הביטול</button>
        <button type="button" class="btn btn-secondary" onclick="closeModal()">ביטול</button>
      </div>
    </form>
  `;
  document.getElementById('overlay').classList.add('open');
}

async function submitCancelForm(e){
  e.preventDefault();
  const payload = {
    formType: 'cancellation',
    childFirst: document.getElementById('cChildFirst').value,
    childLast: document.getElementById('cChildLast').value,
    email: document.getElementById('cEmail').value,
    parent1: document.getElementById('cParent1').value,
    parent2: document.getElementById('cParent2').value,
    phone: document.getElementById('cPhone').value,
    courseName: document.getElementById('cCourseName').value,
    cancelDate: document.getElementById('cDate').value,
  };

  const modal = document.getElementById('modalContent');
  modal.innerHTML = `<div class="success-box"><div class="big">⏳</div><h2>שולחים את הבקשה...</h2></div>`;

  try{
    await fetch(SECTIONS[currentSection].sheetUrl, {
      method:'POST',
      mode:'no-cors',
      headers:{ 'Content-Type':'text/plain' },
      body: JSON.stringify(payload)
    });
  }catch(err){
    console.error('Cancellation submission failed', err);
  }

  modal.innerHTML = `
    <div class="success-box">
      <div class="big">✅</div>
      <h2>בקשת הביטול נשלחה</h2>
      <p style="color:var(--ink-soft); font-size:14.5px; line-height:1.6;">מזכירות המתנ"ס תטפל בבקשה בהקדם.</p>
      <div class="modal-footer" style="padding-top:6px;">
        <button class="btn btn-secondary" onclick="closeModal()">סגירה</button>
      </div>
    </div>
  `;
  return false;
}

// ============ לוח חופשות ============
async function openHolidaysView(){
  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <div class="modal-head">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h2>לוח חופשות</h2>
    </div>
    <div class="modal-body" id="holidaysBody" style="padding-bottom:20px;">
      <div style="text-align:center; padding:20px 0;"><div style="font-size:32px;">⏳</div>טוען...</div>
    </div>
  `;
  document.getElementById('overlay').classList.add('open');

  try{
    const data = await jsonpRequest(SECTIONS.regular.sheetUrl + '?action=holidays');
    const text = (data.text || '').toString().trim();
    const body = document.getElementById('holidaysBody');

    if(!text){
      body.innerHTML = `<p style="color:var(--ink-soft);">אין כרגע מידע על חופשות.</p>`;
      return;
    }

    const escaped = text
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    body.innerHTML = `<div style="white-space:pre-wrap; line-height:1.8; font-size:14.5px; color:var(--ink);">${escaped}</div>`;
  }catch(err){
    console.error('Failed to load holidays', err);
    document.getElementById('holidaysBody').innerHTML = `<p style="color:var(--ink-soft);">לא הצלחנו לטעון את לוח החופשות כרגע. נסו לרענן את הדף.</p>`;
  }
}

(async function init(){
  buildSectionTabs();
  const ok = await loadCourses();
  if(ok){
    buildFilters();
    renderGrid();
  }
})();
</script>
