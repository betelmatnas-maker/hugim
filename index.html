  .hero-bar{ background:var(--sky); }
  .hero-bar-inner{ max-width:1100px; margin:0 auto; padding:20px 24px; color:#fff; }
  .hero-bar-inner p.sub{
    font-size:clamp(14px,2vw,17px); margin:0 0 16px; max-width:640px; opacity:.92; font-weight:500;
  }

  .search-wrap{ display:flex; gap:10px; max-width:520px; }
  .search-wrap input{
    flex:1; border:none; padding:14px 16px;
    font-size:16px; font-family:inherit; box-shadow:var(--shadow);
    min-width:0;
  }
  .search-wrap input:focus{outline:3px solid rgba(255,255,255,.6);}

  /* ---------- Section tabs (חוגים / חוגי שחיה) ---------- */
  .section-tabs-wrap{ max-width:1100px; margin:22px auto 0; padding:0 24px; }
  .section-tabs-caption{
    font-family:'Rubik',sans-serif; font-weight:700; font-size:14px; color:var(--ink-soft);
    text-align:center; margin-bottom:12px;
  }
  .section-tabs{
    display:flex; gap:16px; flex-wrap:wrap;
  }
  .section-tab{
    flex:1 1 260px; border:2px solid var(--line); background:var(--bg-card);
    box-shadow:0 4px 14px rgba(43,33,24,0.10);
    padding:24px 20px; cursor:pointer; position:relative; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px;
    min-height:150px; justify-content:center;
    transition:transform .15s, box-shadow .15s, border-color .15s;
    color:var(--ink);
  }
  .section-tab:hover{ transform:translateY(-3px); box-shadow:0 10px 22px rgba(43,33,24,0.18); }
  .section-tab .tab-icon{ font-size:34px; line-height:1; }
  .section-tab .tab-title{ font-family:'Rubik',sans-serif; font-weight:800; font-size:19px; }
  .section-tab .tab-desc{ font-size:12.5px; color:var(--ink-soft); font-weight:600; }
  .section-tab .tab-check{
    position:absolute; top:10px; left:10px; width:26px; height:26px;
    background:var(--sky); color:#fff; display:none; align-items:center; justify-content:center;
    font-weight:800; font-size:14px;
  }
  .section-tab.active{ border-color:var(--sky); border-width:3px; }
  .section-tab.active .tab-check{ display:flex; }
  .section-tab.active .tab-desc{ color:var(--ink); }

  /* ---------- Start gate (know vs. help me choose) ---------- */
  .start-gate{ max-width:1100px; margin:22px auto 0; padding:0 24px; }
  .start-gate-inner{
    background:var(--bg-card); border:1px solid var(--line); box-shadow:var(--shadow);
    padding:22px;
  }
  .start-gate-inner h2{ font-size:18px; margin:0 0 14px; }
  .gate-options{ display:flex; gap:12px; flex-wrap:wrap; }
  .gate-btn{
    flex:1 1 240px; text-align:right; border:1.5px solid var(--line); background:var(--bg);
    padding:16px; cursor:pointer; display:flex; flex-direction:column; gap:4px; transition:.15s;
  }
  .gate-btn:hover{ border-color:var(--ink); transform:translateY(-2px); }
  .gate-btn-accent{ background:var(--coral); border-color:var(--coral); }
  .gate-btn-accent .gate-title, .gate-btn-accent .gate-sub{ color:#fff; }
  .gate-icon{ font-size:22px; }
  .gate-title{ font-weight:800; font-family:'Rubik',sans-serif; font-size:15px; color:var(--ink); }
  .gate-sub{ font-size:12.5px; color:var(--ink-soft); }

  .interest-badge{
    border:none; background:var(--plum-soft); color:var(--plum); font-weight:700; font-size:13px;
    padding:7px 14px; cursor:pointer; display:none; align-items:center; gap:6px;
  }
  .wizard-options{ display:flex; flex-direction:column; gap:8px; margin:10px 0 4px; }
  .wizard-opt{
    text-align:right; border:1.5px solid var(--line); background:var(--bg);
    padding:13px 16px; font-size:14.5px; font-weight:600; cursor:pointer; transition:.15s;
  }
  .wizard-opt:hover{ border-color:var(--sky); background:var(--sky-soft); }
  .wizard-opt.selected{ border-color:var(--sky); background:var(--sky); color:#fff; font-weight:800; }

  .wizard-hint{
    background:var(--gold-soft); border-right:4px solid var(--gold); padding:11px 14px;
    font-size:12.5px; color:#7a5a12; margin:4px 0 16px; line-height:1.6;
  }
  .age-stepper-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
  .age-stepper-row .age-label{ font-weight:700; font-size:14px; }
  .stepper{ display:flex; align-items:center; border:1.5px solid var(--line); }
  .stepper button{ width:40px; height:40px; border:none; background:var(--bg); font-size:20px; font-weight:800; cursor:pointer; color:var(--sky); }
  .stepper button:hover{ background:var(--sky-soft); }
  .stepper input{
    width:56px; text-align:center; border:none; border-right:1.5px solid var(--line); border-left:1.5px solid var(--line);
    font-size:16px; font-weight:700; padding:9px 0; background:#fff;
  }
  .remove-age-btn{ background:none; border:none; color:var(--coral); font-size:18px; font-weight:700; cursor:pointer; padding:0 4px; }

  /* ---------- Filters ---------- */
  .filters{max-width:1100px; margin:26px auto 0; padding:0 24px;}
  .filter-label{font-weight:700; font-size:13px; color:var(--ink-soft); margin:0 0 8px 2px;}
  .chip-row{display:flex; flex-wrap:wrap; gap:8px; padding-bottom:2px; margin-bottom:16px;}
  .chip{
    flex:0 0 auto; border:1.5px solid var(--line); background:#fff; color:var(--ink);
    padding:9px 16px; border-radius:0; font-size:14px; font-weight:600; cursor:pointer;
    white-space:nowrap; transition:.15s;
  }
  .chip.active{background:var(--sky); color:#fff; border-color:var(--sky);}

<script>
let COURSES = [];

const CATEGORY_COLORS = [
  {keys:['כדורגל','כדורסל','טאווקנדו'], bg:'var(--coral-soft)', fg:'var(--coral)'},
  {keys:['ריקוד','מחול','תיאטרון','ריקודי עם'], bg:'var(--plum-soft)', fg:'var(--plum)'},
  {keys:['כושר','יוגה','פלדנקרייז'], bg:'var(--teal-soft)', fg:'var(--teal)'},
  {keys:['אלקטרוניקה','טבע'], bg:'var(--sky-soft)', fg:'var(--sky)'},
  {keys:['ערבית'], bg:'var(--gold-soft)', fg:'#8a6a12'},
];
function colorFor(category){
  for(const g of CATEGORY_COLORS){ if(g.keys.some(k=>category.includes(k))) return g; }
  return {bg:'var(--gold-soft)', fg:'#8a6a12'};
}

const DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי'];

// Each "section" is a fully separate data source (its own Google Sheet + Apps Script deployment)
// but shares the exact same site design, filters, wizard, and registration flow.
const SECTIONS = {
  regular: {
    label: 'חוגים',
    desc: 'ספורט, מחול, אמנות ועוד',
    icon: '🏃',
    sheetUrl: "https://script.google.com/macros/s/AKfycbyn-X3Fd625vlIJ3k2OwQgJWqT6XY40a4oDhpqHQ-oxszlDTECDTxHNtmHsnRwRnFGW/exec"
  },
  swim: {
    label: 'חוגי שחיה',
    desc: 'כל חוגי השחייה בבריכה',
    icon: '🏊',
    sheetUrl: "https://script.google.com/macros/s/AKfycbx4q6imlVE5V7XzlX8fieRWietxqSFGWPr-z3lu2Z83lEWPLjIPKte9c4kxKQyCpjdv/exec"
  }
};
let currentSection = 'regular';

// ---- derive an age-group label from the course name/category (mirrors the original data prep) ----
function deriveAgeGroup(name, category){
  name = name || ''; category = category || '';
  const text = name + ' ' + category;

  // maps a specific age (in years) to its bucket label - same thresholds used by the wizard's age question
  function ageToLabel(age){
    if(age < 6) return 'גיל הרך (גן-ב׳)';
    if(age < 10) return 'כיתות א׳-ד׳';
    if(age < 14) return 'כיתות ה׳-ח׳';
    if(age < 18) return 'נוער';
    return 'מבוגרים / כולם';
  }

  // 1) explicit numeric age range in the text, e.g. "גילאי 5-8", "בני 3-5", "גיל 4-6"
  const numRangeMatch = text.match(/(\d{1,2})\s*[-–]\s*(\d{1,2})/);
  if(numRangeMatch){
    const a = parseInt(numRangeMatch[1],10), b = parseInt(numRangeMatch[2],10);
    if(!isNaN(a) && !isNaN(b) && a>0 && a<99 && b>0 && b<99){
      return ageToLabel(Math.round((a+b)/2));
    }
  }
  // single explicit age mention, e.g. "גיל 6 ומעלה", "בני 4"
  const singleAgeMatch = text.match(/(?:גיל|גילאי|בני|בנות|בן|בת)\s*(\d{1,2})(?!\s*[-–])/);
  if(singleAgeMatch){
    const a = parseInt(singleAgeMatch[1],10);
    if(!isNaN(a) && a>0 && a<99) return ageToLabel(a);
  }

  // 2) school-grade hyphen-range patterns (the original, most common format in the data)
  const checks = [
    ['גן חובה', 'גיל הרך (גן-ב׳)'],
    ['א-ב', 'גיל הרך (גן-ב׳)'],
    ['א-ג', 'כיתות א׳-ד׳'],
    ['ב-ג', 'כיתות א׳-ד׳'],
    ['ג-ד', 'כיתות א׳-ד׳'],
    ['ד-ה', 'כיתות ה׳-ח׳'],
    ['ד-ו', 'כיתות ה׳-ח׳'],
    ['ה-ו', 'כיתות ה׳-ח׳'],
    ['ו-ח', 'כיתות ה׳-ח׳'],
    ['ז-ח', 'כיתות ה׳-ח׳'],
    ['א-ו', 'ילדים (כל הגילאים)'],
  ];
  for(const [pat,label] of checks){ if(name.includes(pat)) return label; }

  // 3) a single grade mentioned alone (no range), e.g. "כיתה ג", "כיתות ה'"
  const singleGradeMatch = text.match(/כית[הות]+\s*['׳`]?\s*([אבגדהוזח])(?![א-ת])/);
  if(singleGradeMatch){
    const g = singleGradeMatch[1];
    if(g==='א' || g==='ב') return 'גיל הרך (גן-ב׳)';
    if(g==='ג' || g==='ד') return 'כיתות א׳-ד׳';
    return 'כיתות ה׳-ח׳'; // ה,ו,ז,ח
  }

  // 4) age-descriptive keywords that aren't grade-based
  if(/תינוקות|פעוטות|טרום\s*חובה|גן\s*טרום/.test(text)) return 'גיל הרך (גן-ב׳)';

  // check the course NAME first - categories like "יוגה גברים/נשים" mix both words
  // and must not override a name that already says which one it is
  if(/נוער|נער/.test(name)) return 'נוער';
  if(name.includes('גברים')) return 'גברים';
  if(name.includes('נשים')) return 'נשים';
  if(/נוער|נער/.test(category)) return 'נוער';
  if(category.includes('גברים') && !category.includes('נשים')) return 'גברים';
  if(category.includes('נשים') && !category.includes('גברים')) return 'נשים';
  if(name.includes('בנות') || name.includes('בנים')) return 'ילדים (כל הגילאים)';
  return 'מבוגרים / כולם';
}

// ---- derive a display icon from the category ----
function deriveIcon(category){
  category = category || '';
  const map = [
    ['פלדנקרייז','🧘'],['כושר','💪'],['ריקוד לטיני','💃'],['טאווקנדו','🥋'],
    ['ריקודי עם','🕺'],['כדורגל','⚽'],['כדורסל','🏀'],['אלקטרוניקה','🔌'],
    ['יוגה','🧘'],['תיאטרון','🎭'],['מחול','🩰'],['טבע','🌿'],['ערבית','🗣️'],
  ];
  for(const [key,icon] of map){ if(category.includes(key)) return icon; }
  return '⭐';
}

// ---- derive which gender(s) a course is aimed at - checks name, then category, then description ----
// (priority order matters: a mixed category label like "יוגה גברים/נשים" must not override
// a course name that already says which one it is)
function deriveGender(name, category, description){
  name = name || ''; category = category || ''; description = description || '';
  const boyWords = ['בנים','גברים','נערים'];
  const girlWords = ['בנות','נשים','נערות'];
  const hasAny = (text, words) => words.some(w => text.includes(w));

  for(const text of [name, category, description]){
    const isBoy = hasAny(text, boyWords);
    const isGirl = hasAny(text, girlWords);
    if(isBoy && !isGirl) return 'בנים/גברים';
    if(isGirl && !isBoy) return 'בנות/נשים';
  }
  return 'משותף לכולם';
}

// ---- map a specific age (in years) to the age-group bucket(s) it could plausibly fall under ----
function ageToAgeGroups(age){
  const groups = new Set();
  if(age<=7) groups.add('גיל הרך (גן-ב׳)');
  if(age>=6 && age<=9) groups.add('כיתות א׳-ד׳');
  if(age>=9 && age<=13) groups.add('כיתות ה׳-ח׳');
  if(age>=13 && age<=17) groups.add('נוער');
  if(age<18) groups.add('ילדים (כל הגילאים)');
  if(age>=18){ groups.add('נשים'); groups.add('גברים'); groups.add('מבוגרים / כולם'); }
  return [...groups];
}

// ---- load data via JSONP (a <script> tag load, not fetch) - this avoids CORS blocks entirely ----
function jsonpRequest(url){
  return new Promise((resolve, reject)=>{
    const cbName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random()*10000);
    const script = document.createElement('script');

    const cleanup = () => { delete window[cbName]; script.remove(); };

    window[cbName] = (data) => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error('JSONP request failed')); };

    const sep = url.includes('?') ? '&' : '?';
    script.src = url + sep + 'callback=' + cbName;
    document.body.appendChild(script);
  });
}

// ---- fetch the live course list from the currently selected section's Google Sheet ----
async function loadCourses(){
  const grid = document.getElementById('grid');
  grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="big">⏳</div>טוען את רשימת החוגים...</div>`;

  const url = SECTIONS[currentSection].sheetUrl;
  if(!url){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="big">🚧</div>הקטע הזה עוד לא מחובר לנתונים. בקרוב!</div>`;
    COURSES = [];
    return true;
  }

  try{
    const data = await jsonpRequest(url + '?action=courses');
    const rows = data.courses || [];

    COURSES = rows.map((r, i) => {
      const category = (r['תחום']||'').toString().trim();
      const name = (r['שם החוג']||'').toString().trim();
      const description = (r['מלל']||'').toString().trim() || 'פרטים נוספים יתעדכנו בקרוב.';
      return {
        id: 'c'+i,
        category,
        name,
        instructor: (r['מדריך/מדריכה']||'').toString().trim(),
        time: (r['שעת החוג']||'').toString().trim(),
        day: (r['יום']||'').toString().trim(),
        location: (r['מיקום']||'').toString().trim() || 'יתעדכן בהמשך',
        description,
        price: (r['מחיר של החוג']||'').toString().trim() || 'המחיר יתעדכן',
        phone: (r['טלפון']||'').toString().trim(),
        paymentLink: (r['קישור']||'').toString().trim() || 'https://www.matnas-betel.org.il/page.php?type=hugSearch',
        ageGroup: deriveAgeGroup(name, category),
        gender: deriveGender(name, category, description),
        icon: deriveIcon(category),
      };
    }).filter(c => c.name);
  }catch(err){
    console.error('Failed to load courses from sheet', err);
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="big">⚠️</div>לא הצלחנו לטעון את רשימת החוגים כרגע. נסו לרענן את הדף.</div>`;
    return false;
  }
  return true;
}

// Short, plain-language summary of the matnas' own registration terms (see full policy via the link in the form)
const TERMS_SUMMARY = `
<b>עיקרי התקנון:</b><br>
• ההרשמה מושלמת רק לאחר מילוי טופס זה <b>וגם</b> ביצוע תשלום באתר התשלומים של המתנ"ס.<br>
• רישום עד ה-15 לחודש מחויב בעלות חודשית מלאה; לאחר ה-15 בחצי מהעלות.<br>
• פתיחת חוג מותנית במספר נרשמים מינימלי, והמתנ"ס רשאי שלא לפתוח חוג בהתאם.<br>
• היעדרות מפגישה אינה פוטרת מתשלום, למעט מקרים חריגים (כגון מחלה ממושכת, באישור רפואי).<br>
• ביטול חוג אפשרי רק עד למועד שנקבע ע"י המתנ"ס בתחילת שנת הפעילות.<br>
<a href="https://www.matnas-betel.org.il/page.php?type=page&id=8044" target="_blank" rel="noopener">למדיניות הפרטיות ולנוסח התקנון המלא באתר המתנ"ס</a>
`;

let state = { search:'', category:'הכל', age:'הכל', days:[] };

// Multi-select filters produced by the "help me choose" wizard - a course matches if it
// satisfies at least one chosen value in EACH dimension the person picked something for.
let wizardFilters = { ages:[], genders:[], interests:[], days:[] };

// Broad interest groups used by the "help me choose" wizard (courser-grained than the category chips)
const INTEREST_GROUPS = [
  {label:'ספורט וכדורים', keys:['כדורגל','כדורסל','טאווקנדו'], icon:'⚽'},
  {label:'מחול, ריקוד ותיאטרון', keys:['ריקוד','מחול','תיאטרון'], icon:'💃'},
  {label:'כושר, יוגה ובריאות', keys:['כושר','יוגה','פלדנקרייז'], icon:'🧘'},
  {label:'מדע, טבע וטכנולוגיה', keys:['אלקטרוניקה','טבע'], icon:'🔌'},
  {label:'שפות ולימודים', keys:['ערבית'], icon:'🗣️'},
];

function uniqueSorted(arr){ return [...new Set(arr)]; }

function buildFilters(){
  const cats = ['הכל', ...uniqueSorted(COURSES.map(c=>c.category))];
  const ages = ['הכל', ...uniqueSorted(COURSES.map(c=>c.ageGroup))];

  document.getElementById('categoryChips').innerHTML = cats.map(c=>
    `<button class="chip ${state.category===c?'active':''}" data-type="category" data-val="${c}">${c}</button>`
  ).join('');

  document.getElementById('ageChips').innerHTML = ages.map(a=>
    `<button class="chip ${state.age===a?'active':''}" data-type="age" data-val="${a}">${a}</button>`
  ).join('');

  document.getElementById('dayChips').innerHTML = ['הכל', ...DAYS].map(d=>
    `<button class="chip ${d==='הכל' ? (state.days.length===0?'active':'') : (state.days.includes(d)?'active':'')}" data-day="${d}">${d}</button>`
  ).join('');

  document.querySelectorAll('[data-type]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state[btn.dataset.type] = btn.dataset.val;
      buildFilters();
      renderGrid();
    });
  });

  document.querySelectorAll('[data-day]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const d = btn.dataset.day;
      if(d==='הכל'){
        state.days = [];
      }else if(state.days.includes(d)){
        state.days = state.days.filter(x=>x!==d);
      }else{
        state.days = [...state.days, d];
      }
      buildFilters();
      renderGrid();
    });
  });

  const wizardActive = wizardFilters.ages.length>0 || wizardFilters.genders.length>0 || wizardFilters.interests.length>0 || wizardFilters.days.length>0;
  const anyActive = state.category!=='הכל' || state.age!=='הכל' || state.days.length>0 || state.search.trim()!=='' || wizardActive;
  document.getElementById('resetBtn').classList.toggle('show', anyActive);
  document.getElementById('activeBar').classList.toggle('filtered', anyActive);

  const chipsWrap = document.getElementById('activeChips');
  const chips = [];
  if(state.category!=='הכל') chips.push({label:'תחום: '+state.category, clear:"state.category='הכל'; buildFilters(); renderGrid();"});
  if(state.age!=='הכל') chips.push({label:'גיל: '+state.age, clear:"state.age='הכל'; buildFilters(); renderGrid();"});
  if(state.days.length>0) chips.push({label:'ימים: '+state.days.join(', '), clear:"state.days=[]; buildFilters(); renderGrid();"});
  if(state.search.trim()!=='') chips.push({label:'חיפוש: '+state.search, clear:"state.search=''; document.getElementById('searchInput').value=''; buildFilters(); renderGrid();"});
  if(wizardActive){
    const parts = [];
    if(wizardFilters.ages.length) parts.push(wizardFilters.ages.length+' קבוצות גיל');
    if(wizardFilters.genders.length) parts.push(wizardFilters.genders.length+' מגדר');
    if(wizardFilters.interests.length) parts.push(wizardFilters.interests.length+' תחומי עניין');
    if(wizardFilters.days.length) parts.push(wizardFilters.days.length+' ימים');
    chips.push({label:'מהשאלון: '+parts.join(' · '), clear:"clearInterest();"});
  }

  chipsWrap.classList.toggle('show', chips.length>0);
  chipsWrap.innerHTML = chips.map(c=>
    `<button class="active-chip" onclick="${c.clear}">${c.label} ✕</button>`
  ).join('');
}

function resetFilters(){
  state = { search:'', category:'הכל', age:'הכל', days:[] };
  wizardFilters = { ages:[], genders:[], interests:[], days:[] };
  document.getElementById('searchInput').value='';
  buildFilters();
  renderGrid();
}
document.getElementById('resetBtn').addEventListener('click', resetFilters);
document.getElementById('emptyResetBtn').addEventListener('click', resetFilters);

function matches(course){
  const s = state.search.trim().toLowerCase();
  if(s){
    const hay = (course.name+' '+course.category+' '+course.instructor).toLowerCase();
    if(!hay.includes(s)) return false;
  }
  if(state.category!=='הכל' && course.category!==state.category) return false;
  if(state.age!=='הכל' && course.ageGroup!==state.age) return false;
  if(state.days.length>0 && !state.days.some(d=>course.day.includes(d))) return false;

  if(wizardFilters.ages.length && !wizardFilters.ages.includes(course.ageGroup)) return false;
  if(wizardFilters.genders.length && course.gender!=='משותף לכולם' && !wizardFilters.genders.includes(course.gender)) return false;
  if(wizardFilters.days.length && !wizardFilters.days.some(d=>course.day.includes(d))) return false;
  if(wizardFilters.interests.length){
    const ok = wizardFilters.interests.some(label=>{
      const group = INTEREST_GROUPS.find(g=>g.label===label);
      return group && group.keys.some(k=>course.category.includes(k));
    });
    if(!ok) return false;
  }
  return true;
}

function renderGrid(){
  const list = COURSES.filter(matches);
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  const isFiltered = list.length !== COURSES.length;
  document.getElementById('resultsMeta').textContent = isFiltered
    ? `🔎 מציגים ${list.length} מתוך ${COURSES.length} חוגים לפי הסינון שבחרתם`
    : `${COURSES.length} חוגים בסך הכל`;

  if(list.length===0){
    grid.innerHTML=''; empty.style.display='block'; return;
  }
  empty.style.display='none';

  grid.innerHTML = list.map(c=>{
    const col = colorFor(c.category);
    return `
    <article class="card" data-id="${c.id}">
      <div class="card-top">
        <div class="card-icon" style="background:${col.bg}; color:${col.fg};">${c.icon}</div>
        <div class="tag-row">
          <span class="tag" style="background:${col.bg}; color:${col.fg};">${c.category}</span>
          <span class="tag" style="background:var(--bg); color:var(--ink-soft);">${c.ageGroup}</span>
        </div>
        <h3>${c.name}</h3>
        <div class="meta-line">🗓️ ${c.day} &nbsp;·&nbsp; 🕒 ${c.time}</div>
        <div class="meta-line">📍 ${c.location}</div>
        ${c.phone ? `<div class="meta-line">📞 ${c.instructor ? c.instructor+' · ' : ''}${c.phone}</div>` : ''}
      </div>
      <div class="card-desc">${c.description}</div>
      <div class="card-bottom">
        <span class="price">${c.price}</span>
        <span class="cta-mini">לפרטים והרשמה ←</span>
      </div>
    </article>`;
  }).join('');

  grid.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=> openDetail(card.dataset.id));
  });
}

function openDetail(id){
  const c = COURSES.find(x=>x.id===id);
  const col = colorFor(c.category);
  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <div class="modal-head">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-icon" style="background:${col.bg}; color:${col.fg};">${c.icon}</div>
      <div class="tag-row">
        <span class="tag" style="background:${col.bg}; color:${col.fg};">${c.category}</span>
        <span class="tag" style="background:var(--bg); color:var(--ink-soft);">${c.ageGroup}</span>
      </div>
      <h2>${c.name}</h2>
    </div>
    <div class="modal-body">
      <p>${c.description}</p>
      <div class="info-grid">
        <div class="info-item"><div class="lbl">מדריך/ה</div><div class="val">${c.instructor||'יעודכן'}</div></div>
        <div class="info-item"><div class="lbl">מחיר</div><div class="val">${c.price}</div></div>
        <div class="info-item"><div class="lbl">יום ושעה</div><div class="val">${c.day}, ${c.time}</div></div>
        <div class="info-item"><div class="lbl">מיקום</div><div class="val">${c.location}</div></div>
        ${c.phone ? `<div class="info-item"><div class="lbl">טלפון מדריך/ה</div><div class="val"><a href="tel:${c.phone}">${c.phone}</a></div></div>` : ''}
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="openForm('${c.id}')">המשך להרשמה</button>
      <button class="btn btn-secondary" onclick="closeModal()">חזרה לרשימת החוגים</button>
    </div>
  `;
  document.getElementById('overlay').classList.add('open');
}

function openForm(id){
  const c = COURSES.find(x=>x.id===id);
  const modal = document.getElementById('modalContent');
  const today = new Date().toISOString().split('T')[0];
  modal.innerHTML = `
    <div class="modal-head">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h2>טופס הרשמה מקדים</h2>
      <div class="meta-line">${c.name} · ${c.day} ${c.time}</div>
    </div>
    <form id="regForm" onsubmit="return submitForm(event, '${c.id}')">
      <div class="form-step">
        <div class="field">
          <label for="fname">שם פרטי של הנרשם/ת</label>
          <input type="text" id="fname" required>
        </div>
        <div class="field">
          <label for="lname">שם משפחה</label>
          <input type="text" id="lname" required>
        </div>
        <div class="field readonly">
          <label for="course">שם החוג</label>
          <input type="text" id="course" value="${c.name}" readonly>
        </div>
        <div class="field">
          <label for="phone">טלפון</label>
          <input type="tel" id="phone" required>
        </div>
        <div class="field">
          <label for="entryDate">תאריך כניסה לחוג (כולל שיעור ניסיון)</label>

        </div>
        <div class="form-note">
          ⚠️ שימו לב: ההרשמה לא תושלם עד לביצוע התשלום באתר התשלומים של המתנ"ס. לאחר שליחת טופס זה תועברו להשלמת התשלום וההרשמה הרשמית.
        </div>
        <button type="button" class="terms-toggle" onclick="document.getElementById('termsPanel').classList.toggle('open')">קראו את עיקרי התקנון</button>
        <div class="terms-panel" id="termsPanel">${TERMS_SUMMARY}</div>
        <label class="checkbox-field">
          <input type="checkbox" required>
          <span>אני מאשר/ת שקראתי את התקנון ומדיניות הפרטיות של המתנ"ס ומסכימ/ה לתנאיו.</span>
        </label>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-primary">שליחה והמשך לתשלום</button>

async function submitForm(e, id){
  e.preventDefault();
  const c = COURSES.find(x=>x.id===id);
  const fname = document.getElementById('fname').value;
  const lname = document.getElementById('lname').value;
  const phone = document.getElementById('phone').value;
  const entryDate = document.getElementById('entryDate').value;

  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <div class="success-box">
      <div class="big">⏳</div>
      <h2>רק רגע, מעבירים אתכם לתשלום...</h2>
    </div>
  `;

  const payload = { fname, lname, course:c.name, phone, entryDate };

  try{
    // no-cors + text/plain avoids a slow preflight request against Apps Script
    await fetch(SECTIONS[currentSection].sheetUrl, {
      method:'POST',
      mode:'no-cors',
      headers:{ 'Content-Type':'text/plain' },
      body: JSON.stringify(payload)
    });
  }catch(err){
    console.error('Sheet submission failed', err);
  }

  window.location.href = c.paymentLink;
  return false;
}

function closeModal(){
  document.getElementById('overlay').classList.remove('open');
}
document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id==='overlay') closeModal();
});

document.getElementById('searchInput').addEventListener('input', (e)=>{
  state.search = e.target.value;
  buildFilters();
  renderGrid();
});

document.getElementById('gateKnowBtn').addEventListener('click', ()=>{
  document.getElementById('startGate').style.display='none';
});
document.getElementById('gateHelpBtn').addEventListener('click', ()=> openWizardStep1());

function clearInterest(){
  wizardFilters = { ages:[], genders:[], interests:[], days:[] };
  buildFilters();
  renderGrid();
}

const wizardAnswers = {};

function wizardOptionsScreen(stepLabel, title, options, onContinue){
  const modal = document.getElementById('modalContent');
  const selected = new Set();
  modal.innerHTML = `
    <div class="modal-head">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="meta-line" style="margin-bottom:6px;">${stepLabel}</div>
      <h2>${title}</h2>
    </div>
    <div class="modal-body">
      <div class="wizard-hint">💡 אין חובה לענות - אפשר לבחור כמה תשובות יחד, או פשוט ללחוץ "דלג" ולראות את כל האפשרויות.</div>
      <div class="wizard-options">
        ${options.map(o=>`<button type="button" class="wizard-opt" data-val="${o.val}">${o.label}</button>`).join('')}
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-primary" id="wizardContinueBtn">המשך ←</button>
      <button type="button" class="btn btn-secondary" id="wizardSkipBtn">דלג על השאלה הזו ←</button>
    </div>
  `;
  document.getElementById('overlay').classList.add('open');

  modal.querySelectorAll('.wizard-opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const val = btn.dataset.val;
      if(selected.has(val)){ selected.delete(val); btn.classList.remove('selected'); }
      else{ selected.add(val); btn.classList.add('selected'); }
    });
  });

  document.getElementById('wizardContinueBtn').addEventListener('click', ()=> onContinue([...selected]));
  document.getElementById('wizardSkipBtn').addEventListener('click', ()=> onContinue([]));
}

function openWizardStep1(){
  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <div class="modal-head">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="meta-line" style="margin-bottom:6px;">שאלה 1 מתוך 4</div>
      <h2>מה גיל המשתתפ/ת?</h2>
    </div>
    <div class="modal-body">
      <div class="wizard-hint">💡 אין חובה למלא - אפשר ללחוץ "דלג" למטה ולראות הכל. נרשמים כמה ילדים? לחצו "הוסיפו עוד ילד/ה" כדי להוסיף גיל נוסף.</div>
      <div id="ageInputsWrap"></div>
      <button type="button" class="terms-toggle" id="addAgeBtn">+ הוסיפו עוד ילד/ה</button>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-primary" id="wizardContinueBtn">המשך ←</button>
      <button type="button" class="btn btn-secondary" id="wizardSkipBtn">דלג על השאלה הזו ←</button>
    </div>
  `;
  document.getElementById('overlay').classList.add('open');

  function relabelRows(){
    document.querySelectorAll('#ageInputsWrap .age-stepper-row').forEach((row, i)=>{
      row.querySelector('.age-label').textContent = 'ילד/ה ' + (i+1);
      const removeBtn = row.querySelector('.remove-age-btn');
      removeBtn.style.visibility = document.querySelectorAll('#ageInputsWrap .age-stepper-row').length>1 ? 'visible' : 'hidden';
    });
  }

  function addAgeRow(){
    const wrap = document.getElementById('ageInputsWrap');
    const row = document.createElement('div');
    row.className = 'age-stepper-row';
    row.innerHTML = `
      <span class="age-label">ילד/ה</span>
      <div style="display:flex; align-items:center; gap:8px;">
        <div class="stepper">
          <button type="button" data-action="minus">−</button>
          <input type="number" class="age-num" value="" placeholder="גיל" min="1" max="99">
          <button type="button" data-action="plus">+</button>
        </div>
        <button type="button" class="remove-age-btn">✕</button>
      </div>
    `;
    wrap.appendChild(row);

    const input = row.querySelector('.age-num');
    row.querySelector('[data-action="plus"]').addEventListener('click', ()=>{
      const cur = parseInt(input.value,10);
      input.value = isNaN(cur) ? 5 : Math.min(99, cur+1);
    });
    row.querySelector('[data-action="minus"]').addEventListener('click', ()=>{
      const cur = parseInt(input.value,10);
      input.value = isNaN(cur) ? 1 : Math.max(1, cur-1);
    });
    row.querySelector('.remove-age-btn').addEventListener('click', ()=>{
      row.remove();
      relabelRows();
    });
    relabelRows();
  }

  addAgeRow();
  document.getElementById('addAgeBtn').addEventListener('click', addAgeRow);

  const proceedWith = (ages)=>{
    const groupSet = new Set();
    ages.forEach(age => ageToAgeGroups(age).forEach(g => groupSet.add(g)));
    wizardAnswers.ages = [...groupSet];
    openWizardStep2();
  };

  document.getElementById('wizardContinueBtn').addEventListener('click', ()=>{
    const ages = [...document.querySelectorAll('.age-num')]
      .map(inp => parseInt(inp.value, 10))
      .filter(n => !isNaN(n) && n>0);
    proceedWith(ages);
  });
  document.getElementById('wizardSkipBtn').addEventListener('click', ()=> proceedWith([]));
}

function openWizardStep2(){
  const options = [
    {val:'בנים/גברים', label:'👦 בן / גבר'},
    {val:'בנות/נשים', label:'👧 בת / אישה'},
  ];
  wizardOptionsScreen('שאלה 2 מתוך 4', 'מגדר המשתתפ/ת', options, (vals)=>{
    wizardAnswers.genders = vals;
    openWizardStep3();
  });
}

function openWizardStep3(){
  const options = INTEREST_GROUPS.map(g=>({val:g.label, label:g.icon+' '+g.label}));
  wizardOptionsScreen('שאלה 3 מתוך 4', 'אילו סוגי פעילות מעניינים אתכם?', options, (vals)=>{
    wizardAnswers.interests = vals;
    openWizardStep4();
  });
}

function openWizardStep4(){
  const options = DAYS.map(d=>({val:d, label:d}));
  wizardOptionsScreen('שאלה 4 מתוך 4', 'אילו ימים נוחים לכם?', options, (vals)=>{
    wizardAnswers.days = vals;
    finishWizard();
  });
}

function finishWizard(){
  wizardFilters.ages = wizardAnswers.ages || [];
  wizardFilters.genders = wizardAnswers.genders || [];
  wizardFilters.interests = wizardAnswers.interests || [];
  wizardFilters.days = wizardAnswers.days || [];
  document.getElementById('startGate').style.display='none';
  closeModal();
  buildFilters();
  renderGrid();
  document.getElementById('grid').scrollIntoView({behavior:'smooth', block:'start'});
}

function buildSectionTabs(){
  const wrap = document.getElementById('sectionTabs');
  wrap.innerHTML = Object.keys(SECTIONS).map(key=>{
    const s = SECTIONS[key];
    const extraClass = key==='swim' ? 'section-tab-photo' : '';
    return `<button type="button" class="section-tab ${extraClass} ${key===currentSection?'active':''}" data-section="${key}">
      <span class="tab-check">✓</span>
      <span class="tab-icon">${s.icon}</span>
      <span class="tab-title">${s.label}</span>
      <span class="tab-desc">${s.desc}</span>
    </button>`;
  }).join('');

  wrap.querySelectorAll('.section-tab').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const key = btn.dataset.section;
      if(key===currentSection) return;
      currentSection = key;

      // starting fresh in the new section: clear all filters/wizard state and show the start-gate again
      state = { search:'', category:'הכל', age:'הכל', days:[] };
      wizardFilters = { ages:[], genders:[], interests:[], days:[] };
      document.getElementById('searchInput').value = '';
      document.getElementById('startGate').style.display = '';

      buildSectionTabs();
      const ok = await loadCourses();
      if(ok){ buildFilters(); renderGrid(); }
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

(async function init(){
  buildSectionTabs();
  const ok = await loadCourses();
  if(ok){
    buildFilters();
    renderGrid();
  }
})();
</script>
